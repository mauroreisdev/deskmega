name: DeskMEGA Android

on:
  workflow_dispatch:
    inputs:
      bridge_run_id:
        description: "Reusar bridge-artifact deste run (vazio = gerar de novo)"
        required: false
        default: ""

env:
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  RUST_VERSION: "1.75"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    if: ${{ !inputs.bridge_run_id }}
    uses: ./.github/workflows/bridge.yml

  android-lib:
    needs: [generate-bridge]
    if: ${{ always() && (needs.generate-bridge.result == 'success' || needs.generate-bridge.result == 'skipped') }}
    name: lib ${{ matrix.job.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: true
      matrix:
        job:
          - { target: aarch64-linux-android, abi: arm64-v8a, triplet: arm64-android, script: ndk_arm64.sh }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a, triplet: arm-neon-android, script: ndk_arm.sh }
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git g++ libc6-dev libclang-dev llvm-dev nasm ninja-build pkg-config wget

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply DeskMEGA branding (server, key, WebSocket, name)
        run: python3 .github/deskmega/patch_hbb.py libs/hbb_common/src/config.rs

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Cache vcpkg installed
        id: vcpkg-installed
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/artifacts/vcpkg/installed
          key: vcpkg-installed-${{ matrix.job.triplet }}-${{ env.VCPKG_COMMIT_ID }}-${{ env.NDK_VERSION }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}

      - name: Install vcpkg dependencies
        if: steps.vcpkg-installed.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !inputs.bridge_run_id }}
        with:
          name: bridge-artifact
          path: ./

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.bridge_run_id }}
        with:
          name: bridge-artifact
          path: ./
          run-id: ${{ inputs.bridge_run_id }}
          github-token: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: deskmega-android
          key: ${{ matrix.job.target }}

      - name: Build lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.script }}
          mkdir -p out
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so out/librustdesk.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lib-${{ matrix.job.abi }}
          path: out/librustdesk.so

  android-apk:
    needs: [android-lib]
    if: ${{ always() && needs.android-lib.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install JDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !inputs.bridge_run_id }}
        with:
          name: bridge-artifact
          path: ./

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.bridge_run_id }}
        with:
          name: bridge-artifact
          path: ./
          run-id: ${{ inputs.bridge_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lib-arm64-v8a
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lib-armeabi-v7a
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          SYS=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib
          cp $SYS/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp $SYS/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
          ls -la ./flutter/android/app/src/main/jniLibs/*
          cd flutter
          flutter build apk --release --target-platform android-arm64,android-arm
          ls -la build/app/outputs/flutter-apk/

      - name: Sign APK
        env:
          KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=/usr/local/lib/android/sdk/build-tools/$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          mkdir -p dist
          if [ -z "$KEY_B64" ]; then
            echo "::warning::Sem chave de assinatura - APK fica com assinatura debug"
            cp flutter/build/app/outputs/flutter-apk/app-release.apk dist/DeskMEGA-${{ env.VERSION }}-debugsign.apk
            exit 0
          fi
          echo "$KEY_B64" | base64 -d > ks.jks
          $BT/zipalign -f -p 4 flutter/build/app/outputs/flutter-apk/app-release.apk dist/aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out dist/DeskMEGA-${{ env.VERSION }}.apk dist/aligned.apk
          rm -f ks.jks dist/aligned.apk
          $BT/apksigner verify --print-certs dist/DeskMEGA-${{ env.VERSION }}.apk
          $BT/aapt2 dump badging dist/DeskMEGA-${{ env.VERSION }}.apk | head -5 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeskMEGA-android
          path: dist/*.apk
